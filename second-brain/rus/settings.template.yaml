# Настройки программы «Второй мозг» (раздел 17 спецификации). Удобнее менять в Obsidian:
# Настройки → Второй мозг. Файл лежит рядом с программой, не в хранилище.
# Строки после # — пояснения, программа их не читает.

# Папка хранилища Obsidian — её вписывает «Установка.bat». Плагин работает с открытым хранилищем;
# эта строка нужна только для запуска программы из командной строки. Слэши можно писать прямые.
vault: ""

llm:
  mode: "cloud"   # cloud — облачная модель; local — своя на этом компьютере (сервер llama.cpp); webchat — вручную через веб-чат
  cloud_profile: "p1"   # id профиля облачной модели (из списка profiles)
  local_profile: ""   # id профиля локальной модели
  profiles:            # профили моделей. Цены — $ за 1 млн токенов (для подсчёта расходов); пусто — не считать деньги
    - id: "p1"
      name: "Z.ai"
      kind: "cloud"
      base_url: "https://api.z.ai/api/paas/v4"   # адрес в формате OpenAI
      model: ""   # название модели, точно как у провайдера — впишите перед первым запуском
      api_key_file: "api_key.txt"   # файл с ключом рядом с программой (в хранилище не попадает)
      temperature: 0.2
      max_tokens:   # предел длины ответа; пусто — как у провайдера
      json_mode: false   # true — если сервер умеет response_format: json_object
      extra: {}   # особые параметры запроса, например {"thinking": {"type": "disabled"}} у GLM
      timeout_sec: 600   # сколько секунд ждать ответа
      max_input_chars: 300000   # предел запроса, знаков; больше — материал делится на части
      prices: {"input": null, "cached_input": null, "output": null}   # вход, вход из кэша, выход — $ за 1 млн токенов
      budget_month:   # свой лимит профиля в месяц, $
  webchat: {"max_input_chars": 300000}   # ручной режим: предел запроса, знаков
  roles: {}            # свой профиль для шагов, пример: {"Синтез": "p2", "Вопросы": "webchat"}
  max_format_retries: 2   # сколько раз просить модель исправить формат ответа

embeddings:
  mode: "local"   # local — на этом компьютере (llama.cpp); cloud — облачные эмбеддинги
  base_url: "http://127.0.0.1:8081/v1"   # адрес сервера; кнопка «Запустить модель…» в плагине вписывает его сама
  model: "KaLM-Embedding-Gemma3-12B-2511"   # название модели на сервере; при смене все векторы пересчитаются сами
  api_key_file: "embeddings_api_key.txt"   # нужен только для mode: cloud
  batch: 16   # текстов за один запрос
  max_chars: 6000   # длиннее — обрезается для поиска (сама запись не меняется)
  timeout_sec: 600
  price_input:   # облачные эмбеддинги: $ за 1 млн токенов
  server:              # своя модель на llama.cpp: Настройки → Второй мозг → Модели → «Запустить модель…»
    device: "cpu"   # cpu — процессор; gpu — видеокарта
    build: "auto"   # сборка llama.cpp для видеокарты: auto — CUDA для NVIDIA, иначе Vulkan; cuda; vulkan
    gpu_layers: "auto"   # слоёв модели на видеокарте: auto — сколько поместится, all — все (у модели 48), или число
    ctx: 4096   # контекст, токенов: самый длинный текст за раз; больше — больше памяти (4096 — около 8,4 ГБ, 8192 — 9,6 ГБ)
    kv_cache: "f16"   # квантование KV-кеша: f16 | q8_0 | q4_0 — этой модели почти ничего не даёт (KV-кеш она не хранит)
    threads: 0   # потоков процессора; 0 — llama.cpp решит сам
    port: 8081   # адрес сервера будет http://127.0.0.1:<порт>/v1
    sleep_min: 15   # через сколько минут простоя выгружать модель из памяти; 0 — не выгружать
    autostart: true   # программа сама запускает сервер, когда он нужен (ничего не скачивая)
    models_dir: ""   # папка для модели (6,9 ГБ); пусто — models в папке программы

budget:                # бюджет на облачные модели
  monthly_usd:   # $ в месяц на все облачные профили; пусто — без бюджета
  warn_pct: 80   # с этого процента — предупреждение; при 100% программа спросит, продолжать ли

estimate:              # оценка перед большим запуском: обращения, время, деньги
  enabled: true
  calls: 30   # спрашивать подтверждение, если обращений больше
  usd: 0.5   # …или стоимость больше, $
  minutes: 10   # …или дольше, минут

input:
  split_by_dates: true   # файл-дневник с датами в начале записей — по отдельной записи на дату

updates:               # обновления программы с GitHub (ссылка на репозиторий — в brain/__init__.py, UPDATE_REPO)
  check_on_start: true   # плагин проверяет обновление при запуске Obsidian

thresholds:            # общие пороги; свои у контейнера — поле thresholds в его YAML (или вкладка «Контейнер» в плагине)
  classification: 70   # Раскладка без вопроса: с этой уверенности модели запись раскладывается в контейнер сама, ниже — уходит в _на_проверку с вопросом
  hint_shift: 15   # Вес вашей подсказки: сколько пунктов уверенности прибавляется варианту из подсказки hint:
  high: 90   # Высокая уверенность: с этой уверенности программа сама создаёт контейнеры и под-контейнеры, делает запись общей для нескольких контейнеров, переводит росток в проекты
  mode_guess: 70   # Догадка о режиме файла: с этой уверенности модель сама решает, массовая ли это загрузка или одна запись
  compaction: 60   # Уплотнение: с этой зашумлённости запись сначала сжимается моделью (исходный текст остаётся)
  value_min: 30   # Минимальная ценность: аспекты ценнее этого идут в базу синтеза, остальные остаются только в пуле
  value_primary: 70   # Первостепенное: с этой ценности аспект считается первостепенным — документы опираются на него в первую очередь
  duplicate_similarity: 0.86   # Похожесть для поиска дублей: с такой похожести пары аспектов показываются модели как возможные дубли
  neighbor_similarity: 0.88   # Похожесть соседей: с такой похожести записи из разных контейнеров программа спрашивает, всё ли разложено верно
  pattern_similarity: 0.8   # Похожесть для паттернов: насколько близкими должны быть аспекты, чтобы команда «Паттерны» сочла их связкой

seed_dormancy_days: 90 # росток без новых мыслей дольше этого — вопрос «ещё актуален?»

dialogue_markers:      # разметка диалогов с ИИ в txt
  user: ["я:"]
  ai: ["ИИ:"]

sources:               # источники = подпапки _staging (например _staging/Чат с ИИ/). compaction_shift — на сколько пунктов понизить порог уплотнения
  - name: "архив"
    color: "#94A3B8"
    compaction_shift: 0
  - name: "заметка"
    color: "#60A5FA"
    compaction_shift: 0
  - name: "Чат с ИИ"
    color: "#A78BFA"
    compaction_shift: 20

style:                 # стиль документов Фазы 2. Для контейнера — поле style в его YAML, для документа — style_override
  global: "Пиши ясно и по делу, без воды и общих фраз. Сохраняй формулировки автора там, где они точны."

limits:                # пределы запросов к модели — обычно менять не нужно
  max_containers_in_prompt: 150   # контейнеров в запросе классификации
  max_items_per_value_call: 400   # элементов за одну оценку ценности
  max_questions_per_entity: 3     # уточняющих вопросов на запись
